analyzer:
  errors:
    specify_nonobvious_property_types: ignore
    discarded_futures: ignore
    cascade_invocations: ignore
    # Flutter 3.47 deprecates `package:flutter/material.dart` (and
    # `package:flutter/cupertino.dart`) in favour of `package:material_ui` /
    # `package:cupertino_ui`, so every import of them is a
    # `deprecated_member_use` info and the bare `flutter analyze` step of
    # `.github/workflows/flutter-test.yaml` fails on 144 of them. REMOVE THIS
    # when the imports are migrated — tracked in #59.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:very_good_analysis/analysis_options.yaml
exclude:
  - "**/*.g.dart"
  - "**/*.g.theme.dart"

formatter:
  trailing_commas: preserve

linter:
  rules:
    public_member_api_docs: false
    always_put_required_named_parameters_first: false
    prefer_asserts_with_message: false
    prefer_constructors_over_static_methods: false
    avoid_positional_boolean_parameters: false
    document_ignores: false
    avoid_types_on_closure_parameters: false
    remove_deprecations_in_breaking_versions: false
