include: package:flutter_lints/flutter.yaml

plugins:
  solidart_lint: ^3.0.0

formatter:
  trailing_commas: preserve

linter:
  rules:
    avoid_print: false
analyzer:
  errors:
    # Flutter 3.47 deprecates package:flutter/material.dart in favour of
    # material_ui. Silenced until that migration lands — see #59.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
