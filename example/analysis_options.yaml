include: package:flutter_lints/flutter.yaml

plugins:
  solidart_lint: ^3.0.0

formatter:
  trailing_commas: preserve

linter:
  rules:
    avoid_print: false
analyzer:
  # Deliberately no `deprecated_member_use: ignore` here: a category-wide
  # mute would hide every future first-party deprecation, not just the SDK
  # import #59 was added for. Silence those narrowly, per import, instead.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
