include: package:flutter_lints/flutter.yaml

plugins:
  solidart_lint: ^3.0.0

formatter:
  trailing_commas: preserve

linter:
  rules:
    avoid_print: false
analyzer:
  errors:
    # See the root analysis_options.yaml: the SDK's `material.dart` import
    # deprecation fails `flutter analyze` until the imports are migrated
    # (#59). REMOVE THIS with that migration.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
