name: example
description: "A new Flutter project."

publish_to: "none"

version: 7.3.0

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  zuraffa_ui:
    path: ..
  flutter_solidart: ^2.1.0
  awesome_flutter_extensions: ^2.0.1
  google_fonts: 6.3.2
  collection: ^1.18.0
  get: ^4.6.6
  boxy: ^2.2.1
  disco: ^1.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0
