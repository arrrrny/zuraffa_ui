name: Update Dart File Hashes

# NOTE: this repo's default branch is `master`. This workflow stays parked
# until the `BOT_TOKEN` secret exists — without it the push below 403s and
# every master push goes red. To enable it, point `branches` at `master` and
# add the secret. Run `.github/scripts/generate_hashes.sh` by hand in the
# meantime to refresh `cli/hashes.json`.
on:
  push:
    branches:
      - main

jobs:
  update-hashes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_TOKEN }}

      - name: Run hash generation script
        run: |
          bash .github/scripts/generate_hashes.sh

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add cli/hashes.json
          git commit -m "Update hashes.json with latest Dart file SHAs" || echo "No changes to commit"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
