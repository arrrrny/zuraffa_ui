name: Update goldens

# Golden images are Linux-rendered artifacts (issue #7: macOS pixel-drifts
# ~0.2%, so comparisons run only here). Dispatch this workflow to regenerate
# every `matchesGoldenFile` golden on Linux and push the result back to the
# branch — the same regenerate-and-commit pattern build-runner.yaml uses
# for codegen. Run it after adding/altering golden fixtures; never commit
# goldens generated on macOS.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to check out and push goldens to
        required: true
        default: master

permissions:
  contents: write

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Scoped to the UINode golden suite plus the component golden suites —
      # everything matchesGoldenFile renders, always regenerated on Linux.
      - name: Regenerate UINode goldens on Linux
        run: flutter test test/uinode/golden_test.dart --update-goldens

      - name: Regenerate component goldens on Linux
        # CI's floating stable (channel: stable, unpinned) re-renders these
        # goldens on every SDK bump — 3.47.9 -> 3.50.0 drifted badge.png by
        # 0.03% and failed the suite under --fail-fast, then alert.png by
        # 0.12% once the suite ran past it. Regenerate ALL component suites
        # (sheet/alert included) on the exact image CI tests on: the pixels
        # stay Linux-rendered, and an exclusion only guarantees the next SDK
        # bump re-fails CI on the excluded suite.
        run: |
          tests=$(find test/src/components -name '*_test.dart' | sort)
          flutter test $tests --update-goldens

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated goldens
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/goldens/*.png'
          git commit -m "test: regenerate goldens on Linux [skip ci]"
          git push
