# Sync upstream (nank1ro/flutter-shadcn-ui) into the fork's `master` daily.
#
# The fork's contract with the engine (spec 1099, "upstream sync stays
# mechanical") is:
#
#   1. Never auto-resolve a conflict in favour of upstream. On any conflict,
#      abort the merge, open (or comment on) a `sync`-labelled issue listing
#      the conflicted files, and FAIL the job. A human resolves on a
#      `sync/fork-sync-resolution` branch and merges manually.
#   2. After a clean merge, every entry in `.github/FORK_OWNED_FILES` must
#      still exist and still contain its survival marker. A clean merge that
#      silently dropped fork-owned code fails the job and opens an issue.
#   3. A clean merge re-runs `scripts/generate_zfa_aliases.dart`. The Zfa brand
#      map is derived from the engine (`lib/zfa.dart` and everything it
#      exports), so upstream adding an engine name must add its `Zfa*` alias;
#      `test/identified/zfa_alias_coverage_test.dart` guards the drift. The
#      regenerated map is committed on top of the merge, then pushed.
#
# `master` is also covered by `.github/workflows/flutter-test.yaml` on push, so
# the merged tree is verified by the full suite right after this job pushes.

name: Sync Upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Deny all permissions by default; grant the minimum per job below.
permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream to master
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A PAT is only needed when the merge touches `.github/workflows/**`
          # — the job token cannot push workflow files. Everything else works
          # with `github.token`, so the secret is optional.
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/nank1ro/flutter-shadcn-ui.git || true

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Switch to master
        run: git checkout master || git checkout -b master origin/master

      - name: Check if already up to date
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream changes (no auto-resolve)
        id: merge
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          set +e
          git merge upstream/main --no-edit \
            -m "merge: sync upstream $(date +%Y-%m-%d)"
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "merge_state=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_state=conflicts" >> "$GITHUB_OUTPUT"
            CONFLICTS=$(git diff --name-only --diff-filter=U | sort)
            {
              echo "conflicts<<EOF"
              echo "$CONFLICTS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Open sync-conflict issue
        if: steps.merge.outputs.merge_state == 'conflicts'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const conflicts = `${{ steps.merge.outputs.conflicts }}`.trim().split('\n').filter(Boolean);
            const local = '${{ steps.check.outputs.local }}';
            const upstream = '${{ steps.check.outputs.upstream }}';
            const body = [
              'The daily upstream sync encountered **' + conflicts.length + '** merge conflict(s) and aborted per the fork-upstream-sync policy (see `.github/workflows/sync-upstream.yml` and AGENTS.md).',
              '',
              'Auto-resolving in favour of upstream is **not** permitted — these conflicts carry fork-owned code (the identified `Zfa*` layer, the package identity, the check-imports gate).',
              '',
              '## Conflicted files',
              '',
              ...conflicts.map((f) => '- `' + f + '`'),
              '',
              '## Resolution procedure',
              '',
              '1. `git fetch upstream main` and note the SHA below.',
              '2. Create a branch: `git switch -c sync/fork-sync-resolution upstream/main`',
              '3. Merge the fork in: `git merge origin/master --no-ff`',
              '4. Resolve each conflict in favour of the fork plus the upstream change (the engine keeps upstream spelling; `lib/zfa.dart` and `lib/src/identified/**` are fork-owned).',
              '5. Regenerate the brand map: `dart run scripts/generate_zfa_aliases.dart`',
              '6. Verify: `flutter analyze && flutter test test/identified/` (CI runs the full suite on the PR).',
              '7. Open a PR titled `chore: sync upstream $(date +%Y-%m-%d)` and reference this issue.',
              '8. After the PR merges, the next scheduled sync is a no-op.',
              '',
              '## Commit refs',
              '',
              '- local master: `' + local + '`',
              '- upstream/main: `' + upstream + '`',
              '',
              'cc: the fork maintainer.',
            ].join('\n');

            // Comment on an existing open sync issue instead of duplicating it.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync', per_page: 10
            });
            const existing = issues.data.find((i) => i.title.includes('merge conflicts'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: '🔄 New sync conflict detected on ' + new Date().toISOString().split('T')[0] + '.\n\n' + body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'sync: upstream merge conflicts require manual resolution',
                labels: ['sync'], body,
              });
            }

      - name: Fail job on conflict
        if: steps.merge.outputs.merge_state == 'conflicts'
        run: |
          echo "::error::merge conflicts detected; sync aborted. See the sync-labelled issue for resolution steps."
          exit 1

      - name: Verify fork-owned file markers
        id: verify
        if: steps.merge.outputs.merge_state == 'clean'
        run: |
          set +e
          MISSING=()
          MARKER_MISSING=()
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
            esac
            path=$(echo "$line" | sed -e 's/[[:space:]]*::.*$//')
            marker=$(echo "$line" | sed -e 's/^.*::[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$path" ] || [ -z "$marker" ]; then
              MARKER_MISSING+=("malformed entry: $line")
              continue
            fi
            if [ ! -f "$path" ]; then
              MISSING+=("$path")
              continue
            fi
            if ! grep -q -F "$marker" "$path"; then
              MARKER_MISSING+=("$path (missing marker: $marker)")
            fi
          done < .github/FORK_OWNED_FILES
          set -e
          if [ ${#MISSING[@]} -gt 0 ] || [ ${#MARKER_MISSING[@]} -gt 0 ]; then
            {
              echo "missing_files<<EOF"
              printf '%s\n' "${MISSING[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "marker_missing<<EOF"
              printf '%s\n' "${MARKER_MISSING[@]}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "guard_state=fail" >> "$GITHUB_OUTPUT"
          else
            echo "guard_state=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Open fork-owned-marker issue
        if: steps.verify.outputs.guard_state == 'fail'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const missing = `${{ steps.verify.outputs.missing_files }}`.trim();
            const markerMissing = `${{ steps.verify.outputs.marker_missing }}`.trim();
            const body = [
              'The daily upstream sync completed a clean merge, but the fork-owned-file guardrail (`.github/FORK_OWNED_FILES`) found that upstream silently dropped fork-owned code.',
              '',
              'A clean merge must never remove the `Zfa` layer. Restore it manually on a `sync/fork-marker-restoration` branch and re-merge.',
              '',
              '## Missing files',
              '',
              missing ? missing.split('\n').map((f) => '- `' + f + '`').join('\n') : '_none_',
              '',
              '## Files whose markers are gone',
              '',
              markerMissing ? markerMissing.split('\n').map((f) => '- `' + f + '`').join('\n') : '_none_',
              '',
              'The list lives at `.github/FORK_OWNED_FILES` — update it when a fork-owned piece is intentionally retired.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'sync: fork-owned markers silently dropped by upstream merge',
              labels: ['sync'], body,
            });

      - name: Fail job on guardrail miss
        if: steps.verify.outputs.guard_state == 'fail'
        run: |
          echo "::error::fork-owned-file guardrail failed; see the sync-labelled issue."
          exit 1

      - name: Setup Dart
        if: steps.verify.outputs.guard_state == 'pass'
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Regenerate derived artefacts (Zfa brand map, CLI hashes)
        id: derived
        if: steps.verify.outputs.guard_state == 'pass'
        run: |
          dart scripts/generate_zfa_aliases.dart
          bash .github/scripts/generate_hashes.sh
          if git diff --quiet -- \
            lib/src/identified/mapping/zfa_engine_aliases.dart cli/hashes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "derived artefacts already match the merged tree"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- \
              lib/src/identified/mapping/zfa_engine_aliases.dart cli/hashes.json
          fi

      - name: Commit the regenerated artefacts
        if: steps.derived.outputs.changed == 'true'
        run: |
          git add lib/src/identified/mapping/zfa_engine_aliases.dart cli/hashes.json
          git commit -m "chore: regenerate the Zfa brand map and CLI hashes for upstream $(git rev-parse --short upstream/main)"

      - name: Push
        if: steps.merge.outputs.merge_state == 'clean' && steps.verify.outputs.guard_state == 'pass'
        run: git push origin master

      - name: Open failure issue (catch-all)
        if: failure() && steps.merge.outputs.merge_state != 'conflicts' && steps.verify.outputs.guard_state != 'fail'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The daily upstream sync failed unexpectedly.',
              '',
              'This is a **catch-all** — the specific failure path (conflict, guardrail, push rejection, or other) did not open its own issue.',
              '',
              '## Run',
              '',
              runUrl,
              '',
              '## What to check',
              '',
              '1. Open the run log above and find the failing step.',
              '2. If it is a **push rejection** on `.github/workflows/**`, set the `SYNC_PAT` secret (the job token cannot push workflow files).',
              '3. If it is a **merge conflict**, a separate conflict issue should exist — check the `sync` label.',
              '4. If it is **something else**, resolve manually.',
              '',
              'cc: the fork maintainer.',
            ].join('\n');

            // Dedup: comment on an existing open catch-all if present.
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'sync', per_page: 10
            });
            const existing = issues.data.find((i) =>
              i.title.includes('failed') && !i.title.includes('conflicts') && !i.title.includes('markers')
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: '🔄 Another sync failure on ' + new Date().toISOString().split('T')[0] + '.\n\n' + body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'sync: upstream sync failed (' + new Date().toISOString().split('T')[0] + ')',
                labels: ['sync'], body,
              });
            }
